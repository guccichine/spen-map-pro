name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.0.0"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Stage APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/SPenMapPro.apk
          ls -lh dist/SPenMapPro.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SPenMapPro
          path: dist/SPenMapPro.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: S Pen Map Pro 1.0.0
          files: dist/SPenMapPro.apk
          fail_on_unmatched_files: true
          body: |
            Sideload **SPenMapPro.apk** on your own Galaxy.

            1. Install the APK.
            2. Enable Accessibility for S Pen Map Pro.
            3. Map air actions on the dashboard.
